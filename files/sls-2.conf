# SLS config for receiver instance 2 (belabox-receiver-2).
# Edit freely, then restart the container. No rebuild needed.
#
# Keep these two as they are. Docker maps the host ports to them:
#   http_port 8181  (host port 8182)
#   listen 8282     (host port 8283, and srtla_rec forwards to it)
srt {
    worker_threads 1;
    worker_connections 200;
    http_port 8181;
    cors_header *;
    log_file /dev/stdout;

    server {
        listen 8282;
        latency 2000;
        domain_player play;
        domain_publisher live;
        default_sid play/stream/belabox;
        backlog 10;
        idle_streams_timeout 10;

        app {
            app_publisher stream;
            app_player stream;
        }
    }
}
