# Default: one receiver, same as run.sh / run.bat
#   docker compose up -d
#
# Multiple receivers (main + 2 extras, each with its own SLS/SRTLA):
#   docker compose --profile multi up -d
#
# Each receiver has its own SLS config (files/sls.conf, files/sls-2.conf, ...).
# Edit one and run `docker compose restart <service>`. No rebuild needed.
#
# Only "receiver" runs NOALBS. The extras have ENABLE_NOALBS=false so they never
# touch OBS. Add more extras by copying a block and shifting the host ports.

x-receiver: &receiver
  image: belabox-receiver
  restart: unless-stopped

services:
  receiver:
    <<: *receiver
    build: .
    container_name: belabox-receiver
    environment:
      ENABLE_NOALBS: "true"
      OBS_SRT_PORT: "8282" # must match the port in this receiver's OBS source URL
    volumes:
      - ./files/sls.conf:/etc/sls/sls.conf:ro
    ports:
      - "5000:5000/udp" # SRTLA ingest (BelaBox connects here)
      - "8181:8181"     # SLS stats
      - "8282:8282/udp" # SRT (OBS media source)

  receiver-2:
    <<: *receiver
    profiles: ["multi"]
    container_name: belabox-receiver-2
    depends_on: [receiver]
    environment:
      ENABLE_NOALBS: "false"
      OBS_SRT_PORT: "8283"
    volumes:
      - ./files/sls-2.conf:/etc/sls/sls.conf:ro
    ports:
      - "5001:5000/udp"
      - "8182:8181"
      - "8283:8282/udp"

  receiver-3:
    <<: *receiver
    profiles: ["multi"]
    container_name: belabox-receiver-3
    depends_on: [receiver]
    environment:
      ENABLE_NOALBS: "false"
      OBS_SRT_PORT: "8284"
    volumes:
      - ./files/sls-3.conf:/etc/sls/sls.conf:ro
    ports:
      - "5002:5000/udp"
      - "8183:8181"
      - "8284:8282/udp"
